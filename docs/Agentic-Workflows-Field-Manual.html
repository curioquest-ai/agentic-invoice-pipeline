<style>
:root{
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:'IBM Plex Sans',-apple-system,'Helvetica Neue',Arial,sans-serif;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --ground:#070508; --panel:#090a0c; --panel-2:#0b0d0f;
  --hair:#14171a; --hair-2:#1c2024;
  --cream:#e8edf2; --body:#9fa5ab; --muted:#7a7f85; --faint:#51565b;
  --accent:#3fa9ff; --accent-lt:#93cdff;
  --live:#3ddc97; --warn:#f2b23c; --gap:#f2b23c; --cool:#9d7bff;
}
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1d2023;border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{font-family:var(--serif);background:var(--ground);color:var(--body);height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font-family:var(--mono)}

.shell{display:flex;height:100dvh;overflow:hidden}
.progress-bar{position:fixed;top:0;left:0;right:0;height:2px;z-index:100;background:#0f1113}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-lt));transition:width .12s}
.mobile-toggle{position:fixed;top:10px;left:10px;z-index:200;background:#0f1113;border:1px solid #1d2023;border-radius:8px;color:var(--accent);padding:8px 12px;cursor:pointer;font-family:var(--mono);font-size:13px;display:none}

nav{width:284px;min-width:284px;border-right:1px solid var(--hair);background:#08090b;display:flex;flex-direction:column;padding:24px 0;overflow-y:auto}
.nav-header{padding:0 24px 26px;border-bottom:1px solid var(--hair)}
.nav-header .label{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.15em;margin-bottom:8px}
.nav-header .title{font-family:var(--display);font-size:23px;font-weight:500;color:var(--cream);line-height:1.15}
.nav-header .sub{font-family:var(--mono);font-size:10.5px;color:#333a41;margin-top:10px;line-height:1.7}
.nav-items{padding:18px 12px;flex:1;display:flex;flex-direction:column;gap:2px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;background:transparent;border:none;border-radius:6px;cursor:pointer;border-left:2px solid transparent;text-align:left;transition:background .15s}
.nav-btn:hover:not(.locked){background:#ffffff05}
.nav-btn.active{background:#3f9dff0d;border-left-color:var(--accent)}
.nav-btn.active-brag{background:#3ddc970d;border-left-color:var(--live)}
.nav-btn.locked{opacity:.32;cursor:not-allowed}
.nav-btn .icon{font-family:var(--mono);font-size:10.5px;min-width:20px;color:var(--faint)}
.nav-btn.active .icon{color:var(--accent)}
.nav-btn.active-brag .icon{color:var(--live)}
.nav-btn .text{font-family:var(--serif);font-size:14px;color:#757b81;line-height:1.35}
.nav-btn.active .text,.nav-btn.active-brag .text{color:#dce4ec}
.nav-btn.done .icon{color:var(--live)}
.nav-footer{padding:16px 24px;border-top:1px solid var(--hair)}
.nav-progress{display:flex;gap:4px;margin-bottom:10px}
.nav-progress div{flex:1;height:3px;border-radius:2px;background:#16191c}
.nav-progress div.done{background:var(--live)}
.nav-progress div.current{background:var(--accent)}
.nav-footer .credit{font-family:var(--mono);font-size:10px;color:#2e3237;line-height:1.7}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:140;display:none}
.overlay.show{display:block}

main{flex:1;overflow-y:auto;padding:44px 60px 130px}
.content{max-width:760px;margin:0 auto;animation:fadeIn .3s ease}
.section-header .num{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:.12em}
.section-header .num.alt{color:var(--live)}
.section-header h1{font-family:var(--display);font-size:44px;color:var(--cream);font-weight:500;margin-top:8px;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.section-header .bar{width:46px;height:2px;background:var(--accent);margin-top:20px;border-radius:1px}
.section-header .bar.alt{background:var(--live)}
.section-body{margin-top:44px;display:flex;flex-direction:column}

h2.h2{font-size:25px;font-family:var(--display);color:var(--cream);margin:52px 0 14px;font-weight:500;letter-spacing:-.01em;line-height:1.25;text-wrap:balance}
h2.h2:first-child{margin-top:0}
h3.h3{font-size:13px;font-family:var(--mono);color:var(--accent);margin:34px 0 10px;font-weight:500;text-transform:uppercase;letter-spacing:.1em}
p.p{font-size:15.5px;line-height:1.78;color:#9ba1a7;margin-bottom:15px;max-width:66ch}
strong.b{color:var(--cream);font-weight:600}
code.c{background:#131518;border:1px solid var(--hair-2);border-radius:4px;padding:1px 6px;font-size:13px;color:var(--accent-lt)}
.eyebrow{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--faint);margin-bottom:8px}

.callout{border-radius:10px;padding:16px 20px;margin:22px 0;border:1px solid #3f9dff2e;background:#3f9dff09}
.callout p{font-family:var(--serif);font-size:15px;line-height:1.75;color:#b6bec6;margin:0}
.callout.tip{border-color:#3ddc972e;background:#3ddc9709}
.callout.warning{border-color:#e85d3a2e;background:#e85d3a08}
.callout.warning p{color:#e0c79a}

.code-block{border:1px solid var(--hair-2);border-radius:9px;background:#040506;margin:18px 0;overflow:hidden}
.code-block .header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--hair);background:#0a0b0d}
.code-block .header span{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em}
.copy-code-btn,.brag-copy-btn{background:none;border:1px solid #25292e;border-radius:4px;color:#6a6f74;cursor:pointer;padding:3px 11px;font-size:10.5px;font-family:var(--mono)}
.copy-code-btn:hover,.brag-copy-btn:hover{color:var(--accent);border-color:#28333f}
.copy-code-btn.copied{color:var(--live);border-color:#1d4436}
.code-block pre{padding:14px;overflow-x:auto}
.code-block code{font-size:12.5px;line-height:1.85;color:#9ea3a8;white-space:pre}

.tbl{border:1px solid var(--hair-2);border-radius:9px;overflow-x:auto;margin:20px 0;background:var(--panel)}
.tbl table{border-collapse:collapse;width:100%;min-width:560px}
.tbl th{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--faint);text-align:left;padding:11px 14px;border-bottom:1px solid var(--hair-2);background:#0b0d0f;font-weight:500}
.tbl td{font-family:var(--serif);font-size:14px;color:#959ba1;padding:11px 14px;border-bottom:1px solid #111316;line-height:1.6;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{color:#c4cbd3}
.tbl td .fx{font-family:var(--mono);font-size:12.5px;color:var(--accent-lt);font-variant-numeric:tabular-nums}

.filter-bar,.cat-bar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.cat-bar{margin-bottom:22px}
.filter-btn,.cat-btn{background:none;border:1px solid var(--hair-2);border-radius:20px;padding:5px 13px;font-family:var(--mono);font-size:11px;color:#6a6f74;cursor:pointer}
.filter-btn:hover,.cat-btn:hover{border-color:#2c3238;color:#91979e}
.filter-btn.active,.cat-btn.active{border-color:#3f9dff55;color:var(--accent);background:#3f9dff0d}
.filter-btn.active-p3{border-color:#e85d3a55;color:var(--gap);background:#e85d3a0d}
.filter-btn.active-p1{border-color:#3ddc9755;color:var(--live);background:#3ddc970d}

.pcard{border:1px solid var(--hair);border-radius:10px;background:var(--panel);margin-bottom:9px;overflow:hidden}
.pcard.expanded{border-color:#232930}
.pcard .card-toggle{width:100%;background:none;border:none;cursor:pointer;text-align:left;padding:15px 18px;display:block}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.card-id{font-family:var(--mono);font-size:11px;color:#393e43}
.card-title{font-family:var(--serif);font-size:15.5px;color:#d6dce2;line-height:1.4}
.card-tagline{font-family:var(--serif);font-size:13.5px;color:#73797f;margin-top:5px;line-height:1.6}
.card-badges{display:flex;align-items:center;gap:7px;flex-shrink:0;padding-top:2px}
.badge{font-family:var(--mono);font-size:10px;padding:2.5px 8px;border-radius:4px;white-space:nowrap}
.badge-p3{color:var(--gap);background:#e85d3a12;border:1px solid #e85d3a2b}
.badge-p2{color:var(--accent);background:#3f9dff12;border:1px solid #3f9dff2b}
.badge-p1{color:var(--live);background:#3ddc9712;border:1px solid #3ddc972b}
.badge-stage{color:#6a6f74;background:#131518;border:1px solid var(--hair-2)}
.arrow{font-family:var(--mono);font-size:12px;color:#393e43}
.pcard.expanded .arrow{color:var(--accent)}
.card-body{display:none;padding:0 18px 18px}
.pcard.expanded .card-body{display:block}
.qbox{padding:12px 15px;background:#040506;border:1px solid var(--hair);border-radius:8px;font-family:var(--mono);font-size:13px;color:#bec5cd;line-height:1.75}
.qbox.example{color:#888e94;border-style:dashed}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.meta-grid .k{font-family:var(--mono);font-size:9.5px;color:#454b51;text-transform:uppercase;letter-spacing:.11em;margin-bottom:4px}
.meta-grid .v{font-family:var(--serif);font-size:13.5px;color:#8d9399;line-height:1.6}
.winbox{margin-top:14px;padding:11px 15px;background:#3ddc9707;border:1px solid #3ddc971c;border-radius:8px}
.winbox .k{font-family:var(--mono);font-size:9.5px;color:var(--live);text-transform:uppercase;letter-spacing:.11em;margin-bottom:4px}
.winbox .v{font-family:var(--serif);font-size:13.5px;color:#959ba1;line-height:1.65}

.scope-label{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.11em;margin-bottom:8px}
.scope-input{width:100%;background:#040506;border:1px solid var(--hair-2);border-radius:8px;padding:12px 14px;color:#d6dce2;font-family:var(--serif);font-size:14.5px;line-height:1.6;resize:vertical}
.scope-input::placeholder{color:#34393e}
.scope-input:focus{border-color:#3f9dff55;outline:none}
.lock-btn,.continue-btn{width:100%;margin-top:18px;padding:14px;border-radius:9px;border:1px solid #3f9dff3d;background:#3f9dff0f;color:var(--accent);font-family:var(--serif);font-size:15px;cursor:pointer}
.lock-btn:hover,.continue-btn:hover{background:#3f9dff1a}
.continue-btn{margin-top:56px}

.timeline{display:flex;flex-direction:column;border-left:1px solid var(--hair-2);margin:22px 0 8px;padding-left:0}
.slot{display:grid;grid-template-columns:96px 1fr;gap:18px;padding:14px 0 14px 18px;border-bottom:1px solid #111316;position:relative}
.slot:last-child{border-bottom:none}
.slot::before{content:"";position:absolute;left:-4.5px;top:20px;width:8px;height:8px;border-radius:50%;background:var(--ground);border:1.5px solid var(--accent)}
.slot.demo::before{border-color:var(--live)}
.slot .time{font-family:var(--mono);font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.6}
.slot .dur{font-family:var(--mono);font-size:10px;color:#454b51;margin-top:3px}
.slot .what{font-family:var(--serif);font-size:15px;color:#d6dce2;line-height:1.5}
.slot .detail{font-family:var(--serif);font-size:13.5px;color:#7f8489;margin-top:5px;line-height:1.65}
.slot .out{font-family:var(--mono);font-size:11px;color:var(--live);margin-top:7px}

.gates{display:flex;flex-direction:column;gap:8px;margin:20px 0}
.gate{display:flex;gap:15px;padding:13px 16px;background:var(--panel);border:1px solid var(--hair);border-radius:8px}
.gate .g{font-family:var(--mono);font-size:11px;color:var(--accent);min-width:52px;padding-top:2px}
.gate .t{font-family:var(--serif);font-size:14px;color:#959ba1;line-height:1.65}

.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0}
.lane{padding:14px 16px;background:var(--panel);border:1px solid var(--hair);border-radius:9px}
.lane .n{font-family:var(--mono);font-size:12px;margin-bottom:6px}
.lane .d{font-family:var(--serif);font-size:12.5px;color:#747b82;line-height:1.6}

.stack{display:flex;flex-direction:column;gap:9px;margin:20px 0}
.layer{padding:13px 16px;background:var(--panel);border:1px solid var(--hair);border-radius:9px;border-left:2px solid var(--accent)}
.layer .n{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:5px}
.layer .n span:first-child{font-family:var(--mono);font-size:11.5px;color:var(--cream)}
.layer .n span:last-child{font-family:var(--mono);font-size:10px;color:#454b51}
.layer .d{font-family:var(--serif);font-size:13.5px;color:#82888f;line-height:1.7}

.checks{display:flex;flex-direction:column;gap:7px;margin:18px 0}
.check{display:flex;gap:13px;padding:12px 15px;background:var(--panel);border:1px solid var(--hair);border-radius:8px;align-items:flex-start}
.check .m{font-family:var(--mono);font-size:11px;color:var(--accent);padding-top:2px;min-width:16px}
.check .t{font-family:var(--serif);font-size:14px;color:#959ba1;line-height:1.65}
.check .t b{color:#d6dce2;font-weight:600}

.ref-link{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:11px 15px;border:1px solid var(--hair);border-radius:8px;background:var(--panel);margin-bottom:7px;text-decoration:none}
a.ref-link:hover{border-color:#262f38}
.ref-link .label{font-family:var(--serif);font-size:14px;color:#aeb5bc}
.ref-link .url{font-family:var(--mono);font-size:10.5px;color:#454b51;text-align:right;word-break:break-all}
a.ref-link:hover .url{color:var(--accent)}

.postcard{border:1px solid var(--hair-2);border-radius:10px;background:var(--panel);overflow:hidden;margin:14px 0}
.postcard .ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 17px;border-bottom:1px solid var(--hair)}
.postcard .pn{font-family:var(--mono);font-size:12.5px;color:#d6dce2}
.postcard .pu{font-family:var(--mono);font-size:10.5px;color:#454b51;margin-top:2px}
.postcard pre{padding:15px 17px;font-family:var(--serif);font-size:13.5px;color:#888e94;line-height:1.8;white-space:pre-wrap;margin:0}
.open-link{font-family:var(--mono);font-size:10.5px;text-decoration:none;padding:4px 10px;border-radius:4px}

@media(max-width:900px){
  .mobile-toggle{display:block}
  nav{position:fixed;left:0;top:0;bottom:0;z-index:150;transform:translateX(-100%);transition:transform .25s}
  nav.open{transform:none}
  main{padding:64px 22px 110px}
  .section-header h1{font-size:34px}
  h2.h2{font-size:23px}
  .meta-grid,.lanes{grid-template-columns:1fr}
  .slot{grid-template-columns:1fr;gap:6px}
}
</style>

html{color-scheme:dark}
body{margin:0}

<script>
const SECTIONS=[
  {id:"welcome",label:"Before you walk in",icon:"01"},
  {id:"failures",label:"Failure library",icon:"02"},
  {id:"ideas",label:"Idea library",icon:"03"},
  {id:"scope",label:"Scope your build",icon:"✓"},
  {id:"setup",label:"Setup guide",icon:"04"},
  {id:"building",label:"The build day",icon:"05"},
  {id:"after",label:"After the workshop",icon:"06"},
  {id:"brag",label:"Brag about it",icon:"07"}
];

let active="welcome",completed=new Set(),sidebarOpen=false,scopeLocked=false;
let scopeData={prediction:"",track:"",docType:"",criticalField:"",bar:"",volume:"",cutPath:""};
let sevFilter="all",modFilter="all";

const CARDS=[
  {id:"M1",sev:"p1",mod:"eval",title:"Pick the eval before the framework",
   tag:"The order you choose things in decides whether you can ever tell if it works.",
   rule:"Choose how you will grade the output before you choose what will produce it.",
   why:"A framework picked first becomes the thing you defend. An eval picked first becomes the thing you optimise against — and it will happily tell you your favourite framework lost.",
   cost:"Weeks. Teams rebuild the parser three times and still cannot say which version was better.",
   fix:"Today you write 04-eval before you are allowed to be proud of 03-parser. That ordering is the workshop."},
  {id:"M2",sev:"p1",mod:"generator",title:"Truth first, chaos on purpose, with a log",
   tag:"The rule of the day. Every module downstream depends on this ordering.",
   rule:"Generate ground truth before you generate documents.",
   why:"We are not labelling documents; we are manufacturing documents from labels. bot.py writes the truth line to ground_truth.jsonl <em>before</em> it fills the form, so the label can never drift from the artefact.",
   cost:"If you invert it you are back to hand-labelling, which nobody finishes, which means no eval, which means no M1.",
   fix:"faker_in.py → chaos.py → truth written → form filled → PDF printed. Read bot.py and watch the ordering."},
  {id:"M3",sev:"p1",mod:"parser",title:"Extraction transcribes; validation judges",
   tag:"Never let one model do both. This is the highest-value idea in the repo.",
   rule:"The scariest failure is the silent correction.",
   why:"An LLM asked to ‘extract and verify’ will quietly repair broken tax math into consistency — destroying the exact signal (data-entry errors) the pipeline exists to surface. You get a clean number and no idea anything was wrong.",
   cost:"Undetectable. Your accuracy looks fine and your error-detection rate is silently zero.",
   fix:"schema.py transcribes verbatim. validators.py judges, in deterministic Python. Two files, on purpose."},
  {id:"M4",sev:"p1",mod:"eval",title:"Headline accuracy is a lie",
   tag:"Slice by difficulty tier or you are reporting a number that means nothing.",
   rule:"Never report the ALL column on its own. Slice first, then look.",
   why:"‘94% accurate’ can mean 100% on clean documents and 40% on the broken 8% — and the broken 8% is often the entire reason the pipeline exists. But the point is not that the broken column is always worst; the point is that <em>until you slice you do not know where your difficulty lives.</em> In our own rehearsal it inverted: item.amount scored 59% on clean and 100% on broken, because the broken tier injects business-rule violations that do not make a document any harder to <em>read</em>. Real difficulty was in Indian 2-2-3 number formatting, which cuts across every tier. That is a better finding than the one we expected, and we only had it because the matrix exists.",
   cost:"You ship, and production is mostly the tail you never measured — or you harden the tier you assumed was hard and never touch the one that was.",
   fix:"eval.py emits a per-field × per-tier matrix. Tier mix per 100 is clean 60 / ok 20 / bad 12 / broken 8. Read every cell before you believe any headline."},
  {id:"M5",sev:"p1",mod:"eval",title:"The harness is the asset; the parser is disposable",
   tag:"What you should actually be protective of at the end of today.",
   rule:"Models change every quarter. The harness that grades them does not.",
   why:"Your parser will be obsolete within two model releases. The dataset, the schema, the validators and the eval survive every swap and are what let you adopt a new model in an afternoon instead of a quarter.",
   cost:"Teams that only own a parser have to re-earn trust from scratch on every model upgrade.",
   fix:"Keep 02-generator and 04-eval. Throw 03-parser away as often as you like."},
  {id:"G1",sev:"p1",mod:"generator",title:"Synthetic data with no labels",
   tag:"The #1 mistake in the wild, per the repo.",
   rule:"Generating synthetic documents, then planning to hand-label later. Later never comes.",
   why:"Unlabelled synthetic data is just noise you paid to create. Without labels there is no eval, and without an eval you are back to vibes.",
   cost:"The whole dataset, retroactively worthless.",
   fix:"Write the truth line first. It is one line of code and it is the difference between a dataset and a pile of PDFs."},
  {id:"G2",sev:"p1",mod:"parser",title:"Document content is DATA, not instructions",
   tag:"An invoice is an untrusted input. Treat it like one.",
   rule:"A hostile invoice that says ‘ignore previous instructions’ is an attack surface.",

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function h2(t){return '<h2 class="h2">'+t+'</h2>'}
function h3(t){return '<h3 class="h3">'+t+'</h3>'}
function p(t){return '<p class="p">'+t+'</p>'}
function b(t){return '<strong class="b">'+t+'</strong>'}
function c(t){return '<code class="c">'+t+'</code>'}
function callout(t,type){return '<div class="callout '+(type||"")+'"><p>'+t+'</p></div>'}
function codeBlock(code,lang){return '<div class="code-block"><div class="header"><span>'+(lang||"bash")+'</span><button class="copy-code-btn" data-code="'+esc(code)+'">copy</button></div><pre><code>'+esc(code)+'</code></pre></div>'}
function refLink(label,url){return '<a class="ref-link" href="'+url+'" target="_blank" rel="noopener noreferrer"><span class="label">'+label+'</span><span class="url">'+url.replace(/^https?:\/\//,"")+'</span></a>'}
function table(heads,rows){return '<div class="tbl"><table><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join("")+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>'}
function checks(items){return '<div class="checks">'+items.map(x=>'<div class="check"><div class="m">&bull;</div><div class="t"><b>'+x[0]+'</b> &mdash; '+x[1]+'</div></div>').join("")+'</div>'}

function isAccessible(id){
  const order=SECTIONS.map(s=>s.id);
  if(order.indexOf(id)<=order.indexOf("scope"))return true;
  return scopeLocked;
}

  field("cutPath","If you are behind by 15:00, what do you cut?","textarea","Cut document count before tracks. Cut tracks before fields. Never cut the eval — an ungraded parser is the one thing worth nothing.")+
  '<div style="margin-top:26px"><div class="scope-label">Your one-liner</div><div class="qbox" id="scopePreview" style="min-height:64px"></div></div>';
  if(!scopeLocked){
    html+='<button class="lock-btn" id="lockBtn">Lock it in &rarr; open the setup guide</button>';
  }else{
    html+=callout("Scope locked. Every section is open. You can still edit these answers — the plan is yours, not ours.","tip")+
    '<button class="continue-btn" id="continueBtn" style="margin-top:18px">Done. Continue to Setup guide &rarr;</button>';
  }
  return html;
}

function field(key,label,type,ph){
  const v=esc(scopeData[key]||"");
  const el=type==="textarea"
    ? '<textarea class="scope-input scope-field" data-key="'+key+'" rows="2" placeholder="'+esc(ph)+'">'+v+'</textarea>'
    : '<input class="scope-input scope-field" data-key="'+key+'" value="'+v+'" placeholder="'+esc(ph)+'">';
  return '<div style="margin-bottom:20px"><label class="scope-label">'+label+'</label>'+el+'</div>';
}

function updateScopePreview(){
  const el=document.getElementById("scopePreview");
  if(!el)return;
  const d=scopeData, any=Object.values(d).some(v=>v&&v.trim());
  if(!any){el.innerHTML='<span style="color:#3e3439">Fill the fields above and your plan appears here.</span>';return;}
  el.innerHTML="The finder predicts "+em(d.prediction,"[model, cost/doc, fits?]")+", and the eval gets to overrule it at 15:00. "+
    "I am running "+em(d.track,"track [A/B/C]")+" against "+em(d.docType,"[document type]")+
    ", where "+em(d.criticalField,"[the field that must never be wrong]")+" is the field that must never be wrong. "+
    "It ships when "+em(d.bar,"[accuracy bar and who signs off]")+", at "+em(d.volume,"[volume]")+" a month. "+
    "If I am behind by 15:00 I cut "+em(d.cutPath,"[cut path]")+".";
}
function em(v,ph){return v&&v.trim()?'<span style="color:var(--accent-lt)">'+esc(v.trim())+'</span>':'<span style="color:#3e3439">'+ph+'</span>'}

  html+={welcome:welcomeHTML,failures:failuresHTML,ideas:ideasHTML,scope:scopeHTML,setup:setupHTML,building:buildingHTML,after:afterHTML,brag:bragHTML}[active]();
  html+='</div>';
  if(active!=="scope"&&active!=="brag"&&!completed.has(active)&&ci<SECTIONS.length-1){
    html+='<button class="continue-btn" id="continueBtn">Done. Continue to '+SECTIONS[ci+1].label+' &rarr;</button>';
  }
  if(completed.has(active)){
    html+='<div style="display:flex;justify-content:space-between;gap:12px;margin-top:56px;padding-top:28px;border-top:1px solid var(--hair);flex-wrap:wrap">';
    html+=(SECTIONS[ci-1]&&isAccessible(SECTIONS[ci-1].id))?'<button class="nav-page-btn" data-id="'+SECTIONS[ci-1].id+'" style="background:none;border:1px solid var(--hair-2);border-radius:8px;color:#8a8f95;padding:10px 16px;font-family:var(--serif);font-size:14px;cursor:pointer">&larr; '+SECTIONS[ci-1].label+'</button>':'<span></span>';
    html+=(SECTIONS[ci+1]&&isAccessible(SECTIONS[ci+1].id))?'<button class="nav-page-btn" data-id="'+SECTIONS[ci+1].id+'" style="background:#3fa9ff0d;border:1px solid #3fa9ff33;border-radius:8px;color:var(--accent);padding:10px 16px;font-family:var(--serif);font-size:14px;cursor:pointer">'+SECTIONS[ci+1].label+' &rarr;</button>':'<span></span>';
    html+='</div>';
  }
  document.getElementById("contentArea").innerHTML=html;
  bindEvents();
}

function bindEvents(){
  const cb=document.getElementById("continueBtn");
  if(cb)cb.addEventListener("click",()=>{
    completed.add(active);
    const ci=SECTIONS.findIndex(s=>s.id===active);
    if(ci<SECTIONS.length-1){active=SECTIONS[ci+1].id;render();document.getElementById("mainContent").scrollTop=0;}
  });
  const lb=document.getElementById("lockBtn");
  if(lb)lb.addEventListener("click",()=>{
    scopeLocked=true;completed.add("scope");active="setup";
    render();document.getElementById("mainContent").scrollTop=0;
  });
  document.querySelectorAll(".nav-page-btn").forEach(bt=>bt.addEventListener("click",()=>{
    active=bt.dataset.id;render();document.getElementById("mainContent").scrollTop=0;
  }));
  document.querySelectorAll(".copy-code-btn,.brag-copy-btn").forEach(bt=>bt.addEventListener("click",()=>{
    navigator.clipboard.writeText(bt.dataset.code||bt.dataset.text);
    const o=bt.textContent;bt.textContent="copied";bt.classList.add("copied");
    setTimeout(()=>{bt.textContent=o;bt.classList.remove("copied")},1800);
  }));
  document.querySelectorAll(".pcard-toggle").forEach(bt=>bt.addEventListener("click",()=>{
    bt.closest(".pcard").classList.toggle("expanded");
  }));
  document.querySelectorAll(".sev-filter").forEach(bt=>bt.addEventListener("click",()=>{sevFilter=bt.dataset.val;renderContent();}));
  document.querySelectorAll(".mod-filter").forEach(bt=>bt.addEventListener("click",()=>{modFilter=bt.dataset.val;renderContent();}));
  document.querySelectorAll(".scope-field").forEach(el=>el.addEventListener("input",e=>{
    scopeData[e.target.dataset.key]=e.target.value;updateScopePreview();
  }));
}

function render(){renderNav();renderContent();if(active==="scope")setTimeout(updateScopePreview,0);}

document.getElementById("mainContent").addEventListener("scroll",function(){
  const pct=Math.min(this.scrollTop/((this.scrollHeight-this.clientHeight)||1),1);
  document.getElementById("progressFill").style.width=(pct*100)+"%";
});
document.getElementById("mobileToggle").addEventListener("click",()=>{
  sidebarOpen=!sidebarOpen;
  document.getElementById("sidebar").classList.toggle("open",sidebarOpen);
  document.getElementById("overlay").classList.toggle("show",sidebarOpen);
  document.getElementById("mobileToggle").innerHTML=sidebarOpen?"&#10005;":"&#9776;";
});
document.getElementById("overlay").addEventListener("click",()=>{
  sidebarOpen=false;
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("mobileToggle").innerHTML="&#9776;";
});

render();
</script>

</body>
</html>
